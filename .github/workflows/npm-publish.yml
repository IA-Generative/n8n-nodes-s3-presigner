name: Publier sur npm

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Répertoire de travail"
        required: false
        default: '.'
        type: string
      use_ci_artifact:
        description: "Utiliser l'artifact dist produit par la CI au lieu de rebuild"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Configuration de Node.js avec npm
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Récupération de l'artifact de build
        if: inputs.use_ci_artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ inputs.working_directory }}/dist

      - name: Installation des dépendances
        if: ${{ !inputs.use_ci_artifact }}
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Build du projet
        if: ${{ !inputs.use_ci_artifact }}
        working-directory: ${{ inputs.working_directory }}
        run: npm run build

      - name: Extraction des métadonnées du package
        id: meta
        working-directory: ${{ inputs.working_directory }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérification cohérence version tag / package.json
        if: github.ref_type == 'tag'
        working-directory: ${{ inputs.working_directory }}
        env:
          TAG_VERSION: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.meta.outputs.pkg_version }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Tag Git    : $TAG_VERSION"
          echo "package.json : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ La version du tag ($TAG_VERSION) ne correspond pas à celle du package.json ($PKG_VERSION)."
            echo "Mettez à jour la version dans package.json avant de créer le tag."
            exit 1
          fi
          echo "✅ Versions cohérentes : $PKG_VERSION"

      - name: Publication sur npm
        working-directory: ${{ inputs.working_directory }}
        run: npm publish --provenance --access public

      - name: Création de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 📦 Installation

            ### Installation du node n8n

            ```bash
            npm install ${{ steps.meta.outputs.pkg_name }}@${{ github.ref_name }}
            ```

            ### Utilisation dans un Dockerfile n8n

            ```dockerfile
            FROM n8nio/n8n:latest

            USER root

            RUN cd /home/node/.n8n/nodes \
                && npm install ${{ steps.meta.outputs.pkg_name }}@${{ github.ref_name }}

            USER node
            ```
